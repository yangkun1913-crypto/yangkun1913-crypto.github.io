let activeRoute='',loadGeneration=0,archiveFilter='all',artistFilter='all',archiveList=[],lightboxList=[],lightboxIndex=0,lightboxTrigger=null,lightboxLabel='';
const positions=new Map();
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function routeKey(){return location.hash.slice(1)||'work'}
function setImageError(img){const host=img.closest('.media');if(!host)return;host.querySelector('.image-error')?.remove();const error=document.createElement('span');error.className='image-error';const text=document.createElement('span');text.textContent='图片暂时无法载入，点击重试';error.append(text);host.append(error);host.dataset.failed='true'}
function bindImage(img){img.addEventListener('error',()=>setImageError(img));img.addEventListener('load',()=>{const host=img.closest('.media');host?.querySelector('.image-error')?.remove();if(host)delete host.dataset.failed});if(img.complete&&img.currentSrc&&!img.naturalWidth)setImageError(img)}
function retryImage(host){const img=host.querySelector('img');host.querySelector('.image-error')?.remove();delete host.dataset.failed;const src=img.getAttribute('src');img.removeAttribute('src');img.src=src}
function loadAt(items,i=0,generation=loadGeneration){if(generation!==loadGeneration||i>=items.length)return;for(let end=Math.min(i+6,items.length);i<end;i++){const img=items[i];if(img.dataset.srcset){img.srcset=img.dataset.srcset;delete img.dataset.srcset}img.src=img.dataset.src;delete img.dataset.src}if(i<items.length)setTimeout(()=>loadAt(items,i,generation),200)}
function photoMarkup(photo,index){return `<button class="shoot-image media ${photo.w>photo.h?'landscape':''}" data-photo="${index}" aria-label="放大：${escapeHtml(photo.alt)}"><img data-src="${escapeHtml(photo.large)}" ${photo.small?`data-srcset="${escapeHtml(photo.small)} 800w, ${escapeHtml(photo.large)} 2000w" sizes="(max-width:767px) 100vw, 65vw"`:''} width="${photo.w}" height="${photo.h}" decoding="async" alt="${escapeHtml(photo.alt)}"></button>`}
function bindGallery(container,list,label){container.querySelectorAll('img').forEach(bindImage);container.querySelectorAll('[data-photo]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.failed){retryImage(button);return}openLightbox(list,Number(button.dataset.photo),button,label)}));loadAt([...container.querySelectorAll('img[data-src]')])}
function renderProject(project){const next=projects.find(p=>p.id===projectOrder[(projectOrder.indexOf(project.id)+1)%projectOrder.length]);const target=document.getElementById('project-view');target.innerHTML=`<div class="page-head project-heading"><div><h1 tabindex="-1">${project.title}</h1><div class="project-meta"><span>${project.category}</span><span>${project.images.length} 张作品</span></div><p>${project.description}</p></div><a class="back-link" href="#work">返回精选项目</a></div><div class="shoot-grid">${project.images.map(photoMarkup).join('')}</div><div class="next-wrap"><a class="next-project" href="#project/${next.id}"><div><span>下一个项目</span><h2>${next.title}</h2></div><img src="${next.images[0].small}" width="${next.images[0].w}" height="${next.images[0].h}" alt="${next.title}项目封面"></a></div>`;bindGallery(target.querySelector('.shoot-grid'),project.images,project.title);document.title=project.title+' | 许洋堃摄影'}
function renderArchive(){loadGeneration++;archiveList=archive.filter(p=>(archiveFilter==='all'||p.category===archiveFilter)&&(artistFilter==='all'||p.folder===artistFilter));document.getElementById('archive-count').textContent=archiveList.length+' 张作品';const grid=document.getElementById('archive-grid');grid.innerHTML=archiveList.map(photoMarkup).join('')||'<p class="empty">这个分类暂时没有作品，请选择其他分类。</p>';bindGallery(grid,archiveList,'作品索引');document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===archiveFilter)));const artists=document.getElementById('artist-filter');artists.hidden=archiveFilter!=='artist';if(archiveFilter==='artist'){const names=['all',...new Set(archive.filter(p=>p.category==='artist').map(p=>p.folder))];artists.innerHTML=names.map(name=>`<button data-artist="${name}" aria-pressed="${artistFilter===name}">${name==='all'?'全部艺人':name}</button>`).join('');artists.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{artistFilter=b.dataset.artist;renderArchive();document.querySelector(`[data-artist="${artistFilter}"]`).focus()}))}}
function renderRoute(initial=false){const hash=routeKey();if(hash==='main-content'){main.focus();return}const previous=activeRoute;if(previous)positions.set(previous,window.scrollY);activeRoute=hash;loadGeneration++;if(dialog.open)dialog.close();let view='work';let project;if(hash.startsWith('project/')){project=projects.find(p=>p.id===hash.slice(8));if(project)view='project'}else if(['index','about'].includes(hash))view=hash;views.forEach(v=>document.getElementById(v+'-view').hidden=v!==view);document.querySelector('.intro-replay-top').hidden=view!=='work';document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===(view==='project'?'work':view))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title='许洋堃 Xu Yangkun | 摄影作品集';if(view==='project')renderProject(project);if(view==='index')renderArchive();if(view==='work')loadAt([...document.querySelectorAll('#work-view img[data-src]')]);const scroll=positions.get(hash)||0;requestAnimationFrame(()=>{if(!initial){let focus;if(view==='work'&&previous.startsWith('project/'))focus=document.querySelector(`.project-card[href="#${previous}"]`);focus=focus||document.querySelector(`#${view}-view h1`);focus?.focus({preventScroll:true})}window.scrollTo(0,scroll)})}
function openLightbox(list,index,trigger,label){lightboxList=list;lightboxIndex=index;lightboxTrigger=trigger;lightboxLabel=label;document.body.style.overflow='hidden';dialog.showModal();showLightbox()}
function showLightbox(){const photo=lightboxList[lightboxIndex];lightboxError.hidden=true;document.getElementById('lightbox-loading').hidden=false;lightboxImage.style.opacity='0';lightboxImage.alt=photo.alt;lightboxImage.onload=()=>{lightboxImage.style.opacity='1';document.getElementById('lightbox-loading').hidden=true};lightboxImage.onerror=()=>{document.getElementById('lightbox-loading').hidden=true;lightboxError.hidden=false};lightboxImage.src=photo.large;document.getElementById('lightbox-title').textContent=lightboxLabel;document.getElementById('lightbox-counter').textContent=`${lightboxIndex+1} / ${lightboxList.length}`;document.getElementById('lightbox-prev').disabled=lightboxIndex===0;document.getElementById('lightbox-next').disabled=lightboxIndex===lightboxList.length-1}
function stepImage(delta){const next=lightboxIndex+delta;if(next>=0&&next<lightboxList.length){lightboxIndex=next;showLightbox()}}
document.getElementById('lightbox-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{document.body.style.overflow='';if(lightboxTrigger?.isConnected)lightboxTrigger.focus({preventScroll:true});lightboxImage.removeAttribute('src')});document.getElementById('lightbox-prev').addEventListener('click',()=>stepImage(-1));document.getElementById('lightbox-next').addEventListener('click',()=>stepImage(1));document.getElementById('lightbox-retry').addEventListener('click',showLightbox);dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();stepImage(-1)}if(e.key==='ArrowRight'){e.preventDefault();stepImage(1)}});
let touchStart=null;const frame=document.getElementById('lightbox-frame');frame.addEventListener('touchstart',e=>{touchStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});frame.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)stepImage(dx<0?1:-1);touchStart=null},{passive:true});
document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{archiveFilter=button.dataset.category;artistFilter='all';renderArchive()}));
document.querySelectorAll('#work-view img').forEach(bindImage);document.querySelectorAll('.project-card').forEach(link=>link.addEventListener('click',e=>{const host=link.querySelector('.media');if(host.dataset.failed){e.preventDefault();retryImage(host)}}));
document.getElementById('copy-wechat').addEventListener('click',async()=>{const status=document.getElementById('copy-status');try{await navigator.clipboard.writeText('xuyangkun-');status.textContent='微信号已复制'}catch{status.textContent='请长按或选中上方微信号复制'}});
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();main.focus();main.scrollIntoView({block:'start'})});
document.querySelectorAll('.brand,[data-nav]').forEach(link=>link.addEventListener('click',()=>{if(link.hash===location.hash){window.scrollTo(0,0);main.focus({preventScroll:true})}}));
if('scrollRestoration' in history)history.scrollRestoration='manual';window.addEventListener('hashchange',()=>renderRoute());renderRoute(true);

// One bounded intro. Core content is always rendered and navigation remains usable.
const intro=document.getElementById('photo-intro');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
let introRun=0,introTimers=[];
function stopIntro(){introRun++;introTimers.forEach(clearTimeout);introTimers=[];const restore=intro.contains(document.activeElement);intro.hidden=true;intro.classList.remove('leaving');intro.querySelector('.intro-stack').replaceChildren();if(restore)document.querySelector('.brand').focus({preventScroll:true})}
async function playIntro(){
 stopIntro();if(reduceMotion.matches||routeKey()!=='work')return;
 window.scrollTo(0,0);const run=introRun;const compact=innerWidth<768;
 const columns=compact?3:6,rows=compact?6:3;
 const order=[7,10,6,11,4,13,3,14,1,16,0,17,5,12,2,15,8,9];
 const arrangement=order.map((slot,i)=>[((slot%columns)/(columns-1)-.5)*innerWidth,(Math.floor(slot/columns)/(rows-1)-.5)*innerHeight,[-7,5,-3,8,-5,3][i%6]]);
 const photos=[{"small": "开场图片/01.webp", "source": "作品集-web/艺人拍摄/刘旸/_X3A5901.jpg", "alt": "刘旸 · 艺人摄影作品 2"}, {"small": "开场图片/02.webp", "source": "作品集-web/人像摄影/1.jpg", "alt": "人像摄影作品 16"}, {"small": "开场图片/03.webp", "source": "作品集-web/静物摄影/20240627_三巾拍摄0210_底图.jpg", "alt": "静物摄影作品 113"}, {"small": "开场图片/04.webp", "source": "作品集-web/人像摄影/20240123_优可丝_look拍摄2102.jpg", "alt": "人像摄影作品 32"}, {"small": "开场图片/05.webp", "source": "作品集-web/艺人拍摄/刘润铭/DSC_0658.jpg", "alt": "刘润铭 · 艺人摄影作品 13"}, {"small": "开场图片/06.webp", "source": "作品集-web/静物摄影/17-3.jpg", "alt": "静物摄影作品 110"}, {"small": "开场图片/07.webp", "source": "作品集-web/人像摄影/20240606_火箭_飞碟拍摄24735_拷贝.jpg", "alt": "人像摄影作品 39"}, {"small": "开场图片/08.webp", "source": "作品集-web/人像摄影/3.jpg", "alt": "人像摄影作品 70"}, {"small": "开场图片/09.webp", "source": "作品集-web/静物摄影/20250121_手持风扇_八爪鱼风扇拍摄44655_拷贝.jpg", "alt": "静物摄影作品 115"}, {"small": "开场图片/10.webp", "source": "作品集-web/人像摄影/图2_拷贝.jpg", "alt": "人像摄影作品 99"}, {"small": "开场图片/11.webp", "source": "作品集-web/静物摄影/EmptyName_1707.JPG", "alt": "静物摄影作品 130"}, {"small": "开场图片/12.webp", "source": "作品集-web/艺人拍摄/郭碧婷/4R9A5998.jpg", "alt": "郭碧婷 · 艺人摄影作品 7"}, {"small": "开场图片/13.webp", "source": "作品集-web/人像摄影/2025_0207开学季拍摄12831_拷贝.jpg", "alt": "人像摄影作品 60"}, {"small": "开场图片/14.webp", "source": "作品集-web/人像摄影/20231103_孕产拍摄3404.jpg", "alt": "人像摄影作品 27"}, {"small": "开场图片/15.webp", "source": "作品集-web/静物摄影/EmptyName_1771.JPG", "alt": "静物摄影作品 132"}, {"small": "开场图片/16.webp", "source": "作品集-web/人像摄影/img_v3_02c1_1fbcb25a-dac8-4179-b270-9b97e60a269g.jpg", "alt": "人像摄影作品 90"}, {"small": "开场图片/17.webp", "source": "作品集-web/人像摄影/offbox_218821.jpg", "alt": "人像摄影作品 93"}, {"small": "开场图片/18.webp", "source": "作品集-web/艺人拍摄/陈妍希/20260315_金山茶纸尿裤拍摄49714.jpg", "alt": "陈妍希 · 艺人摄影作品 5"}];
 const nodes=photos.map((photo,i)=>{const img=new Image();img.src=photo.small;img.alt='';img.className='intro-photo';const [x,y,r]=arrangement[i];img.style.cssText=`--x:${x}px;--y:${y}px;--r:${r}deg;--delay:${i*75}ms`;return img});
 await Promise.race([Promise.allSettled(nodes.map(img=>img.decode())),new Promise(resolve=>setTimeout(resolve,900))]);
 if(run!==introRun||reduceMotion.matches||routeKey()!=='work')return;
 const ready=nodes.filter(img=>img.complete&&img.naturalWidth);if(ready.length<2)return;
 intro.querySelector('.intro-stack').replaceChildren(...ready);intro.hidden=false;
 introTimers.push(setTimeout(()=>intro.classList.add('leaving'),2700),setTimeout(stopIntro,3700));
}
document.querySelectorAll('[data-replay]').forEach(button=>button.addEventListener('click',()=>{if(routeKey()!=='work'){location.hash='work';return}playIntro()}));
intro.querySelector('.intro-skip').addEventListener('click',stopIntro);
window.addEventListener('hashchange',stopIntro);window.addEventListener('resize',stopIntro);window.addEventListener('wheel',stopIntro,{passive:true});window.addEventListener('touchstart',stopIntro,{passive:true});
document.addEventListener('keydown',event=>{if(!intro.hidden)stopIntro()});reduceMotion.addEventListener('change',stopIntro);
playIntro();
</script>
</body>
